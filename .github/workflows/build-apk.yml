
name: Build Pro Trader APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install SDK packages
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project
        run: |
          unzip -q ProTrader_Android_Studio_Project.zip -d buildsrc
          ls -la buildsrc/ProTrader_Android_Project

      # Fix Java target to match Kotlin JVM 17
      - name: Fix Java JVM Target
        run: |
          cat > buildsrc/ProTrader_Android_Project/jvm17.init.gradle <<'EOF'
          allprojects {
              tasks.withType(org.gradle.api.tasks.compile.JavaCompile).configureEach {
                  sourceCompatibility = '17'
                  targetCompatibility = '17'
              }
          }
          EOF

      - name: Build APK
        working-directory: buildsrc/ProTrader_Android_Project
        run: |
          gradle -I jvm17.init.gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ProTrader-APK
          path: buildsrc/ProTrader_Android_Project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
